# Render Blueprint for the Sapako API.
#
# Postgres lives on Neon rather than Render: Render's own free Postgres
# expires after a fixed period, whereas Neon's free tier has no expiry. The
# database is therefore NOT declared here — DATABASE_URL is set manually.
#
# Free web services sleep after roughly 15 minutes idle and take ~50s to wake.
# See docs/DEPLOYMENT.md for the keep-warm setup.

services:
  - type: web
    name: sapako-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # devDependencies are needed to compile (nest build, typescript), then
    # pruned: nothing in the runtime path needs them, and the free instance
    # has 512 MB to work with.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    # Both steps run from compiled output. The previous version ran migrations
    # through ts-node, which compiles TypeScript in-process on every boot —
    # inside a 512 MB instance that produced a restart loop, with roughly a
    # quarter of all requests returning Render's "no-server" 404. TypeORM
    # records applied migrations, so re-running on each restart is a no-op.
    startCommand: node dist/database/migrate.js && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      # Neon requires TLS; local Postgres serves none. Off by default in code,
      # so it has to be turned on explicitly here.
      - key: DATABASE_SSL
        value: 'true'
      - key: PAGES_PROJECT
        value: sapako
      # sync: false means "prompt me for this, do not store it in the repo".
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Generated by Render rather than carried over. The old value was
      # exposed while diagnosing the Railway outage, and rotating it costs
      # nothing here: the database is new, so there are no sessions to break.
      - key: JWT_SECRET
        generateValue: true
