# Render Blueprint for the Sapako API.
#
# Postgres lives on Neon rather than Render: Render's own free Postgres
# expires after a fixed period, whereas Neon's free tier has no expiry. The
# database is therefore NOT declared here — DATABASE_URL is set manually.
#
# Free web services sleep after roughly 15 minutes idle and take ~50s to wake.
# See docs/DEPLOYMENT.md for the keep-warm setup.

services:
  - type: web
    name: sapako-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # --include=dev is load-bearing: the start command runs migrations through
    # ts-node, which is a devDependency. Render sets NODE_ENV=production, so a
    # plain `npm ci` would omit it and every boot would fail.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run before the server starts, the same ordering Railway's
    # releaseCommand gave us. TypeORM records applied migrations, so re-running
    # on each restart is a no-op.
    startCommand: npm run migration:run && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      # Neon requires TLS; local Postgres serves none. Off by default in code,
      # so it has to be turned on explicitly here.
      - key: DATABASE_SSL
        value: 'true'
      - key: PAGES_PROJECT
        value: sapako
      # sync: false means "prompt me for this, do not store it in the repo".
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Generated by Render rather than carried over. The old value was
      # exposed while diagnosing the Railway outage, and rotating it costs
      # nothing here: the database is new, so there are no sessions to break.
      - key: JWT_SECRET
        generateValue: true
